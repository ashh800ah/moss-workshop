<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rain Study · Tinker Bench demonstration</title>
<style>html,body{margin:0;overflow:hidden;background:#081323;color:#e8f5f2;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}label{position:fixed;top:12px;left:12px;background:#07131bc9;padding:8px 12px;border-radius:8px}input{vertical-align:middle}</style>
<canvas id="rain"></canvas><label>Rain intensity <input id="intensity" aria-label="Rain intensity" type="range" min="10" max="180" value="75"></label>
<script>
'use strict';const canvas=document.getElementById('rain'),ctx=canvas.getContext('2d');
let drops=[],last=0;function resize(){canvas.width=innerWidth;canvas.height=innerHeight;drops=[]}
addEventListener('resize',resize);resize();
function frame(now){const dt=Math.min(40,now-last||16);last=now;
ctx.fillStyle='#081323';ctx.fillRect(0,0,canvas.width,canvas.height);
const rate=Number(document.getElementById('intensity').value);
while(drops.length<rate)drops.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,v:3+Math.random()*6});
ctx.strokeStyle='#a9d8f0aa';ctx.lineWidth=1.3;ctx.beginPath();
for(const d of drops){d.y+=d.v*dt/16;d.x-=dt*.07;if(d.y>canvas.height){d.y=-12;d.x=Math.random()*canvas.width}
ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2,d.y+8)}
ctx.stroke();if(drops.length>rate)drops.length=rate;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></html>
